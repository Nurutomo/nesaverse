<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ nesaverse</title>
    <meta name="description" content="Komunitas meme dan konten seputar UNESA." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Theme bootstrap for initial light/dark mode
      (function () {
        try {
          var theme = null;
          try { theme = window.localStorage ? window.localStorage.getItem('theme') : null; } catch (e) {}
          var prefersDark = false;
          try { prefersDark = !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
          var dark = theme === 'dark' || (!theme && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
